services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
    networks:
      - webnet
    depends_on:
      - frontend
      - backend1
      - backend2
      - backend3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:latest
    container_name: frontend
    # volumes:
    #   - ./app/dist:/app
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - webnet

  backend1:
    build:
      context: ./backend1
      dockerfile: Dockerfile
    image: backend1:latest
    container_name: backend1
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - webnet
  
  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    image: backend2:latest
    container_name: backend2
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - webnet

  backend3: 
    build:
      context: ./backend3
      dockerfile: Dockerfile
    image: backend3:latest
    container_name: backend3
    restart: unless-stopped
    ports:
      - "3002:3000"
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
