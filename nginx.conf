user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    upstream frontend_app {
        server frontend:80; # ใช้ชื่อ container และ port ภายใน docker network
    }

    upstream backend_server {
        server backend1:3000; # Replace with your backend service name and port
        server backend2:3000; # Optional: Add more backend servers for load balancing
        server backend3:3000; # Optional: Add more backend servers for load balancing
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            proxy_pass http://frontend_app;
        }

        # Proxy Backend
        location /api/ {
            proxy_pass http://backend_server; # เป็น upstream backend รวม
        }
    }
